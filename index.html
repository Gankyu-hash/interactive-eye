
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Interactive Eye</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    #eye {
      position: relative;
      width: min(86vw, 620px);
      aspect-ratio: 1 / 1;
      line-height: 0;
      overflow: hidden;

      -webkit-mask-image: url("eye-white.png");
      mask-image: url("eye-white.png");
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    /* 固定眼白 */
    #eye .white {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
    }

    /* 虹膜与瞳孔作为一个整体 */
    #eye .gaze {
      position: absolute;
      inset: 0;
      z-index: 2;
      transform: translate3d(0, 0, 0);
      will-change: transform;
      pointer-events: none;
    }

    #eye .gaze img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
    }

    .iris {
      z-index: 1;
    }

    .pupil {
      z-index: 2;
    }

    @media (prefers-reduced-motion: reduce) {
      #eye .gaze {
        will-change: auto;
      }
    }
  </style>
</head>

<body>

  <div id="eye">
    <img class="white" src="eye-white.png" alt="">

    <div class="gaze" id="gaze">
      <img class="iris" src="iris.png" alt="">
      <img class="pupil" src="pupil.png" alt="">
    </div>
  </div>

  <script>
    const eye = document.querySelector("#eye");
    const gaze = document.querySelector("#gaze");

    // ===== 运动参数 =====

    // 最大移动幅度
    const MAX_X = 0.022;
    const MAX_Y = 0.018;

    // 追踪灵敏度
    const FOLLOW_SPEED = 0.055;

    // 归位速度
    const RETURN_SPEED = 0.035;

    // ===================

    let targetX = 0;
    let targetY = 0;

    let currentX = 0;
    let currentY = 0;

    let lastTime = 0;

    // 平滑限制鼠标输入
    function smoothInput(value) {
      const sign = Math.sign(value);
      const amount = Math.abs(value);

      // 柔和的非线性映射
      const curved = Math.tanh(amount * 1.5) /
                     Math.tanh(1.5);

      return sign * curved;
    }

    function handlePointer(event) {
      const rect = eye.getBoundingClientRect();

      const x = (
        (event.clientX - rect.left) / rect.width - 0.5
      ) * 2;

      const y = (
        (event.clientY - rect.top) / rect.height - 0.5
      ) * 2;

      targetX = smoothInput(
        Math.max(-1, Math.min(1, x))
      );

      targetY = smoothInput(
        Math.max(-1, Math.min(1, y))
      );
    }

    function resetEye() {
      targetX = 0;
      targetY = 0;
    }

    function animate(time) {
      const dt = lastTime
        ? Math.min((time - lastTime) / 16.667, 2)
        : 1;

      lastTime = time;

      const speed =
        targetX === 0 && targetY === 0
          ? RETURN_SPEED
          : FOLLOW_SPEED;

      const factor = 1 - Math.pow(1 - speed, dt);

      currentX += (targetX - currentX) * factor;
      currentY += (targetY - currentY) * factor;

      const rect = eye.getBoundingClientRect();

      const offsetX = currentX * rect.width * MAX_X;
      const offsetY = currentY * rect.height * MAX_Y;

      // 只有虹膜与瞳孔移动
      gaze.style.transform =
        `translate3d(${offsetX}px, ${offsetY}px, 0)`;

      requestAnimationFrame(animate);
    }

    eye.addEventListener("pointermove", handlePointer);

    eye.addEventListener("pointerleave", resetEye);

    window.addEventListener("blur", resetEye);

    eye.addEventListener("pointerup", (event) => {
      if (event.pointerType !== "mouse") {
        resetEye();
      }
    });

    requestAnimationFrame(animate);
  </script>

</body>
</html>
