
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Interactive Eye</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    /* 眼球容器 */
    #eye {
      position: relative;
      width: min(86vw, 620px);
      aspect-ratio: 1 / 1;
      overflow: hidden;
      line-height: 0;

      -webkit-mask-image: url("eye-white.png");
      mask-image: url("eye-white.png");
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    /* 三张图片保持相同尺寸和位置 */
    #eye img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
    }

    /* 第一层：固定眼白 */
    .white {
      z-index: 1;
    }

    /* 第二层：固定虹膜 */
    .iris {
      z-index: 2;
    }

    /* 第三层：独立移动的瞳孔 */
    .pupil {
      z-index: 3;
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    @media (prefers-reduced-motion: reduce) {
      .pupil {
        will-change: auto;
      }
    }
  </style>
</head>

<body>

  <div id="eye">
    <img class="white" src="eye-white.png" alt="">
    <img class="iris" src="iris.png" alt="">
    <img class="pupil" id="pupil" src="pupil.png" alt="">
  </div>

  <script>
    const eye = document.querySelector("#eye");
    const pupil = document.querySelector("#pupil");

    // =========================
    //       瞳孔运动参数
    // =========================

    // 最大移动范围
    const MAX_X = 0.009;
    const MAX_Y = 0.009;

    // 跟随速度
    const FOLLOW_SPEED = 0.055;

    // 回归速度
    const RETURN_SPEED = 0.035;

    // =========================

    let targetX = 0;
    let targetY = 0;

    let currentX = 0;
    let currentY = 0;

    let lastTime = 0;

    // 柔和的非线性输入
    function smoothInput(value) {
      return Math.tanh(value * 1.4) / Math.tanh(1.4);
    }

    // 获取鼠标位置
    function handlePointer(event) {
      const rect = eye.getBoundingClientRect();

      const x = (
        (event.clientX - rect.left) / rect.width - 0.5
      ) * 2;

      const y = (
        (event.clientY - rect.top) / rect.height - 0.5
      ) * 2;

      targetX = smoothInput(
        Math.max(-1, Math.min(1, x))
      );

      targetY = smoothInput(
        Math.max(-1, Math.min(1, y))
      );
    }

    // 鼠标离开时回到中心
    function resetEye() {
      targetX = 0;
      targetY = 0;
    }

    // 动画循环
    function animate(time) {
      const dt = lastTime
        ? Math.min((time - lastTime) / 16.667, 2)
        : 1;

      lastTime = time;

      const isReturning =
        targetX === 0 && targetY === 0;

      const speed = isReturning
        ? RETURN_SPEED
        : FOLLOW_SPEED;

      const factor = 1 - Math.pow(1 - speed, dt);

      currentX += (targetX - currentX) * factor;
      currentY += (targetY - currentY) * factor;

      const rect = eye.getBoundingClientRect();

      const offsetX = currentX * rect.width * MAX_X;
      const offsetY = currentY * rect.height * MAX_Y;

      // 只有黑色瞳孔移动
      pupil.style.transform =
        `translate3d(${offsetX}px, ${offsetY}px, 0)`;

      requestAnimationFrame(animate);
    }

    // 鼠标事件
    eye.addEventListener("pointermove", handlePointer);
    eye.addEventListener("pointerleave", resetEye);

    window.addEventListener("blur", resetEye);

    eye.addEventListener("pointerup", (event) => {
      if (event.pointerType !== "mouse") {
        resetEye();
      }
    });

    requestAnimationFrame(animate);
  </script>

</body>
</html>
