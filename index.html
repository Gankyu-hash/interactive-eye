
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Organic Eye</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    /* 整个眼球的运动容器 */
    #eye-motion {
      position: relative;
      width: min(86vw, 620px);
      aspect-ratio: 1 / 1;
      transform-origin: center center;
      will-change: transform;
      pointer-events: none;
    }

    /* 眼球本体 */
    #eye {
      position: absolute;
      inset: 0;
      overflow: hidden;
      line-height: 0;

      -webkit-mask-image: url("eye-white.png");
      mask-image: url("eye-white.png");
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    /* 所有图层使用相同尺寸和坐标 */
    #eye .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
    }

    .white {
      z-index: 1;
    }

    /* 虹膜与瞳孔的整体 */
    .gaze {
      position: absolute;
      inset: 0;
      z-index: 2;
      transform: translate3d(0, 0, 0);
      will-change: transform;
      pointer-events: none;
    }

    .gaze img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
    }

    .iris {
      z-index: 1;
    }

    .pupil {
      z-index: 2;
    }

    @media (prefers-reduced-motion: reduce) {
      #eye-motion,
      .gaze {
        will-change: auto;
      }
    }
  </style>
</head>

<body>

  <div id="eye-motion">
    <div id="eye">

      <img
        class="layer white"
        src="eye-white.png"
        alt=""
      >

      <div class="gaze" id="gaze">
        <img class="iris" src="iris.png" alt="">
        <img class="pupil" src="pupil.png" alt="">
      </div>

    </div>
  </div>

  <script>
    const eyeMotion = document.querySelector("#eye-motion");
    const gaze = document.querySelector("#gaze");

    // =================================
    //             参数区域
    // =================================

    // 整个眼球的移动幅度
    const MOVE_X = 0.018;
    const MOVE_Y = 0.015;

    // 整体旋转角度
    const ROTATION = 2.2;

    // 虹膜内部微小偏移
    const IRIS_X = 0.001;
    const IRIS_Y = 0.001;

    // 惯性强度
    const STIFFNESS = 0.075;
    const DAMPING = 0.78;

    // 呼吸幅度
    const BREATH_AMOUNT = 0.002;

    // 呼吸速度
    const BREATH_SPEED = 0.0007;

    // =================================

    let targetX = 0;
    let targetY = 0;

    let bodyX = 0;
    let bodyY = 0;
    let bodyRotation = 0;

    let velocityX = 0;
    let velocityY = 0;
    let velocityRotation = 0;

    let irisX = 0;
    let irisY = 0;

    let lastTime = 0;
    let elapsed = 0;

    // 获取鼠标位置
    function handlePointer(event) {
      const rect = eyeMotion.getBoundingClientRect();

      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      targetX = Math.max(-1, Math.min(1,
        (event.clientX - centerX) / (rect.width * 0.9)
      ));

      targetY = Math.max(-1, Math.min(1,
        (event.clientY - centerY) / (rect.height * 0.9)
      ));
    }

    // 鼠标离开时回到中心
    function resetPointer() {
      targetX = 0;
      targetY = 0;
    }

    // 动画循环
    function animate(time) {
      const dt = lastTime
        ? Math.min((time - lastTime) / 16.667, 2)
        : 1;

      lastTime = time;
      elapsed += dt;

      const width = eyeMotion.offsetWidth;
      const height = eyeMotion.offsetHeight;

      // 整体眼球的目标位置
      const desiredX = targetX * width * MOVE_X;
      const desiredY = targetY * height * MOVE_Y;

      const desiredRotation = targetX * ROTATION;

      // 弹簧式运动
      const ax = (desiredX - bodyX) * STIFFNESS;
      const ay = (desiredY - bodyY) * STIFFNESS;
      const ar = (desiredRotation - bodyRotation) * STIFFNESS;

      velocityX = (velocityX + ax * dt) *
        Math.pow(DAMPING, dt);

      velocityY = (velocityY + ay * dt) *
        Math.pow(DAMPING, dt);

      velocityRotation = (velocityRotation + ar * dt) *
        Math.pow(DAMPING, dt);

      bodyX += velocityX * dt;
      bodyY += velocityY * dt;
      bodyRotation += velocityRotation * dt;

      // 虹膜只进行非常微小的相对移动
      const desiredIrisX = targetX * width * IRIS_X;
      const desiredIrisY = targetY * height * IRIS_Y;

      irisX += (desiredIrisX - irisX) * 0.045 * dt;
      irisY += (desiredIrisY - irisY) * 0.045 * dt;

      // 非常轻微的呼吸变化
      const breathing =
        Math.sin(elapsed * BREATH_SPEED) * BREATH_AMOUNT;

      // 整个眼球一起运动
      eyeMotion.style.transform =
        `translate3d(${bodyX}px, ${bodyY}px, 0) ` +
        `rotate(${bodyRotation}deg) ` +
        `scale(${1 + breathing})`;

      // 虹膜与瞳孔同步微调
      gaze.style.transform =
        `translate3d(${irisX}px, ${irisY}px, 0)`;

      requestAnimationFrame(animate);
    }

    // 监听鼠标
    window.addEventListener("pointermove", handlePointer);

    window.addEventListener("blur", resetPointer);
    window.addEventListener("pointerleave", resetPointer);

    window.addEventListener("pointerup", (event) => {
      if (event.pointerType !== "mouse") {
        resetPointer();
      }
    });

    // 启动
    requestAnimationFrame(animate);

  </script>

</body>
</html>
